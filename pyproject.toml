[project]
name = "blackjack"
version = "0.2.0"
description = "A Blackjack game implemented using Flask."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "thomasthaddeus", email = "thaddeus.r.thomas@gmail.com" }
]
dependencies = [
    "flask>=3.1,<4.0",
    "flask-session>=0.8,<0.9",
    "flask-migrate>=4.1,<5.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "loguru>=0.7,<0.8",
    "gunicorn>=25.3,<26.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10.0",
]
docs = [
    "sphinx>=7.4,<8.0",
    "sphinx-rtd-theme>=3.0,<4.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
