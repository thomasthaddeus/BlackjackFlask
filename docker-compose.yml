version: '3.8'
services:
  web:
    build:
      context: ./
      dockerfile: .docker/Dockerfile.dev
    command: flask run --host=0.0.0.0 --port=5001
    volumes:
      - .:/app
    ports:
      - "5001:5001"
    environment:
      - FLASK_CONFIG=${FLASK_CONFIG}
      - FLASK_APP=run.py
      - SECRET_KEY=${SECRET_KEY}
      - DEV_DB_URI=${DEV_DB_URI}
      - TEST_DB_URI=${TEST_DB_URI}
      - PROD_DB_URI=${PROD_DB_URI}
      - PORT=5001
